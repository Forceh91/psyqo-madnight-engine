name: Docs

on:
  push:
    paths:
      - 'docs-site/**'
      - 'tools/**'
      - '.github/workflows/docs-check.yml'
  pull_request:
    paths:
      - 'docs-site/**'
      - 'tools/**'
      - '.github/workflows/docs-check.yml'
  workflow_dispatch:

jobs:
  examples:
    name: Documented examples still work
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 tools/check_doc_examples.py

  site:
    name: Docs site builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      - run: npm run build
